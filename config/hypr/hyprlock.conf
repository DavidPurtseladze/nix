background {
  monitor=
  blur_passes=3
  blur_size=8
  brightness=0.600000
  contrast=1.300000
  noise=0.011700
  path=screenshot
  vibrancy=0.210000
  vibrancy_darkness=0.000000
}

general {
  hide_cursor=true
  ignore_empty_input=true
}

input-field {
  monitor=
  size=250, 50
  dots_center=true
  fade_on_empty=true
  font_color=rgb(248, 248, 242)
  halign=center
  inner_color=rgba(255, 255, 255, 0.1)
  outer_color=rgb(189, 147, 249)
  outline_thickness=3
  placeholder_text=<i>Password...</i>
  position=0, -120
  rounding=22
  valign=center
}

label {
  monitor=
  color=rgb(248, 248, 242)
  font_family=FiraCode Nerd Font
  font_size=90
  halign=center
  position=0, 200
  text=cmd[update:1000] echo "<b><big>$(date +'%H:%M')</big></b>"
  valign=center
}

label {
  monitor=
  color=rgb(189, 147, 249)
  font_family=FiraCode Nerd Font
  font_size=20
  halign=center
  position=0, 120
  text=cmd[update:60000] echo "$(date +'%A, %d %B')"
  valign=center
}
