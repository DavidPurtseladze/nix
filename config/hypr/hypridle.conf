general {
    lock_cmd = flock -n /tmp/qylock.lock qylock-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms("on"))'
}

# Dim backlight
listener {
    timeout = 60
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock screen
listener {
    timeout = 180
    on-timeout = loginctl lock-session
}

# Turn off screen
listener {
    timeout = 300
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms("off"))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms("on"))' && brightnessctl -r
}

# Suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
