set -g status-position bottom
set -g status-justify left
set -g status-left ""
set -g status-right-length 100

setw -g window-status-separator ""
set -g window-status-activity-style "fg=#{@crust},bg=#b4befe"
set -g window-status-bell-style "fg=#{@crust},bg=#f9e2af"

# Window pills
set -g  window-status-format "#[fg=#{E:@window_accent},bg=default] #I:#W #[default]"

set -g  window-status-current-format "#[fg=#{E:@window_accent},bg=default]"
set -ag window-status-current-format "#[fg=#{@crust},bg=#{E:@window_accent},bold] #I:#W "
set -ag window-status-current-format "#[fg=#{E:@window_accent},bg=default]#[default]"

# Running command
set -g  status-right "#[fg=#{@maroon}]"
set -ag status-right "#[fg=#{@crust},bg=#{@maroon}] "
set -ag status-right "#[fg=#{@fg},bg=#{@surface}] #{pane_current_command}"
set -ag status-right "#[fg=#{@surface}] "

# Session
set -ag status-right "#[fg=#{?client_prefix,#{@red},#{@green}}]"
set -ag status-right "#[fg=#{@crust},bg=#{?client_prefix,#{@red},#{@green}}] "
set -ag status-right "#[fg=#{@fg},bg=#{@surface}] #S"
set -ag status-right "#[fg=#{@surface}] "

# Uptime
set -ag status-right "#[fg=#{@sapphire}]"
set -ag status-right "#[fg=#{@crust},bg=#{@sapphire}]󰔟 "
set -ag status-right "#[fg=#{@fg},bg=#{@surface}] #(uptime | sed 's/^[^,]*up *//; s/, *[[:digit:]]* user.*//; s/ day.*, */d /; s/ hr\\(s*\\).*/h/; s/ min\\(s*\\).*/m/; s/ sec\\(s*\\).*/s/; s/\\([0-9]\\{1,2\\}\\):\\([0-9]\\{1,2\\}\\)/\\1h \\2m/;')"
set -ag status-right "#[fg=#{@surface}] "
