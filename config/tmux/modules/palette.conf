# Base
set -g @crust    "#11111b"
set -g @surface  "#313244"
set -g @fg       "#cdd6f4"

# Status module colours
set -g @maroon    "#eba0ac"
set -g @green     "#a6e3a1"
set -g @red       "#f38ba8"
set -g @sapphire  "#74c7ec"

# Per-window accent, picked by window index
set -g  @window_accent "#{?#{==:#{window_index},1},#f38ba8,"  # red
set -ag @window_accent "#{?#{==:#{window_index},2},#fab387,"  # peach
set -ag @window_accent "#{?#{==:#{window_index},3},#f9e2af,"  # yellow
set -ag @window_accent "#{?#{==:#{window_index},4},#a6e3a1,"  # green
set -ag @window_accent "#{?#{==:#{window_index},5},#94e2d5,"  # teal
set -ag @window_accent "#{?#{==:#{window_index},6},#89dceb,"  # sky
set -ag @window_accent "#{?#{==:#{window_index},7},#89b4fa,"  # blue
set -ag @window_accent "#{?#{==:#{window_index},8},#b4befe,"  # lavender
set -ag @window_accent "#{?#{==:#{window_index},9},#cba6f7,"  # mauve
set -ag @window_accent "#{?#{==:#{window_index},10},#f5c2e7,"  # pink
set -ag @window_accent "#{@surface}}}}}}}}}}}"
