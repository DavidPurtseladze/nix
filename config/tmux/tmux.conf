source-file -q ~/.config/tmux/modules/options.conf
source-file -q ~/.config/tmux/modules/keys.conf
source-file -q ~/.config/tmux/modules/palette.conf
source-file -q ~/.config/tmux/modules/status.conf

# Colours from theme-switcher; re-sourced on every theme change.
source-file -q ~/.local/state/theme/tmux-colors.conf

# Plugin run-shell lines; written by home/features/cli/tmux.nix.
source-file -q ~/.local/state/tmux/plugins.conf
